<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Jogo | WebXR CV Game</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="game-page">
    <canvas id="gameCanvas"></canvas>

    <div class="game-hud">
      <div class="hud-stack">
        <span id="scorePill" class="hud-pill">0000</span>
        <span id="lifePill" class="hud-pill">vida 3</span>
        <span id="signalPill" class="hud-pill">camera offline</span>
      </div>
      <div class="hud-stack">
        <span id="roomPill" class="hud-pill">DEMO</span>
        <button id="xrButton" class="hud-button primary" type="button">AR</button>
        <button id="resetButton" class="hud-button" type="button">reset</button>
      </div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/game.js"></script>
  </body>
</html>
